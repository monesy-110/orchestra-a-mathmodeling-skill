<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 128" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">Orchestra — mathematical modeling workflow</title>
  <defs>
    <linearGradient id="inkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2433"/>
      <stop offset="1" stop-color="#0b0f17"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c67c"/>
      <stop offset="0.55" stop-color="#c9a24b"/>
      <stop offset="1" stop-color="#9a7424"/>
    </linearGradient>
  </defs>
  <!-- 标志：七段圆环 + 指挥核心 -->
  <g transform="translate(14 14) scale(0.78)">
    <g fill="none" stroke-linecap="round">
      <path stroke="url(#inkGrad)" stroke-width="9.5" d="M 69.12 22.31 A 42 42 0 0 1 93.40 34.01"/>
      <path stroke="url(#goldGrad)" stroke-width="9.5" d="M 99.78 42.01 A 42 42 0 0 1 105.78 68.29"/>
      <path stroke="url(#inkGrad)" stroke-width="9.5" d="M 103.50 78.27 A 42 42 0 0 1 86.70 99.34"/>
      <path stroke="url(#inkGrad)" stroke-width="9.5" d="M 77.48 103.78 A 42 42 0 0 1 50.52 103.78"/>
      <path stroke="url(#inkGrad)" stroke-width="9.5" d="M 41.30 99.34 A 42 42 0 0 1 24.50 78.27"/>
      <path stroke="url(#inkGrad)" stroke-width="9.5" d="M 22.22 68.29 A 42 42 0 0 1 28.22 42.01"/>
      <path stroke="url(#inkGrad)" stroke-width="9.5" d="M 34.60 34.01 A 42 42 0 0 1 58.88 22.31"/>
    </g>
    <circle cx="64" cy="64" r="4.4" fill="url(#goldGrad)"/>
  </g>
  <!-- 字标 -->
  <text x="118" y="63" fill="url(#inkGrad)" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="600" letter-spacing="1.5">Orchestra</text>
  <text x="121" y="93" fill="#8a7b52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="5.2">MATHEMATICAL MODELING WORKFLOW</text>
  <!-- 金色锚点线 -->
  <rect x="120" y="103" width="118" height="2.5" rx="1.25" fill="url(#goldGrad)"/>
